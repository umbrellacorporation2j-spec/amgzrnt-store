<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle highlight -->
  <ellipse cx="200" cy="120" rx="160" ry="80" fill="white" opacity="0.15"/>
  <!-- Shopping bag -->
  <g filter="url(#shadow)">
    <!-- Bag body -->
    <path d="M140 200 
             C140 190 150 180 170 180 
             L342 180 
             C362 180 372 190 372 200 
             L380 380 
             C380 410 360 430 330 430 
             L182 430 
             C152 430 132 410 132 380 
             Z" fill="url(#bag)"/>
    <!-- Bag handles -->
    <path d="M200 180 
             Q200 120 256 120 
             Q312 120 312 180" 
          fill="none" stroke="#f5f3ff" stroke-width="28" stroke-linecap="round"/>
    <!-- M logo -->
    <path d="M200 280 L230 340 L256 290 L282 340 L312 280" 
          fill="none" stroke="#7c3aed" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom line under M -->
    <line x1="220" y1="370" x2="292" y2="370" stroke="#7c3aed" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
